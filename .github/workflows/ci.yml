name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift
        run: bash .github/swift-toolchain.sh
      - name: Build
        run: swift build
      - name: Checks
        run: swift run Checks
