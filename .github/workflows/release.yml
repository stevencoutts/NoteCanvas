name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.0.0"
        required: true
        type: string

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift
        run: bash .github/swift-toolchain.sh
      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$INPUT_VERSION"
          else
            raw="$REF_NAME"
          fi
          raw="${raw#v}"
          if ! printf '%s' "$raw" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must look like 1.0.0 (got ${raw})." >&2
            exit 1
          fi
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          echo "tag=v$raw" >> "$GITHUB_OUTPUT"
      - name: Build
        run: swift build -c release --product CanvasApp
      - name: Package
        run: bash .github/package-app.sh "${{ steps.ver.outputs.version }}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          zip="dist/NoteCanvas-${VERSION}.zip"
          test -f "$zip"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$TAG" "$zip" --title "NoteCanvas $TAG" --generate-notes --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$zip" --title "NoteCanvas $TAG" --generate-notes --verify-tag
          fi

  # stevec.couttsnet.com serves /downloads/ from /home/stevec/downloads on hetzner.
  # Release zips go in downloads/notecanvas/. This job runs on that host, so it does not need an SSH key in GitHub.
  site-downloads:
    needs: release
    runs-on: [self-hosted, hetzner]
    permissions:
      contents: read
    steps:
      - name: Copy zip into site downloads
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="NoteCanvas-${VERSION}.zip"
          dir="${HOME}/downloads/notecanvas"
          mkdir -p "$dir"
          dest="${dir}/${name}"
          tmp="$(mktemp "${dir}/.${name}.XXXXXX")"
          trap 'rm -f "$tmp"' EXIT
          asset_id=""
          for _ in 1 2 3 4 5 6; do
            asset_id="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" \
              | python3 -c 'import json,sys; name=sys.argv[1]; rel=json.load(sys.stdin); print(next((a["id"] for a in rel.get("assets",[]) if a["name"]==name), ""))' "$name")"
            if [ -n "$asset_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$asset_id" ]; then
            echo "Release asset ${name} was not found." >&2
            exit 1
          fi
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o "$tmp" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          python3 -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).testzip()' "$tmp"
          chmod 644 "$tmp"
          mv "$tmp" "$dest"
          trap - EXIT
